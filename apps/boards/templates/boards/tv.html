{% load static %}<!doctype html>
{# The board the TV shows, full screen. Standalone: it shares nothing with the app's pages. #}
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="{{ pwa.theme_colour }}">
    <title>{{ display.name }} · {{ pwa.name }}</title>
    <link rel="icon" href="{% static 'icons/icon-192.png' %}">
    <link rel="preload" href="{% static 'fonts/barlow-semi-condensed-600-latin.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{% static 'css/board.css' %}">
    <link rel="stylesheet" href="{% static 'css/tv.css' %}">
    <script src="{% static 'js/splitflap.js' %}" defer></script>
  </head>
  <body>
    <div class="stage">
      <div class="board" id="board" data-state-url="{{ state_url }}" data-poll-seconds="{{ poll_seconds }}">
        <div class="grid" id="grid" aria-live="polite"></div>
        <div class="engrave"><span id="boardName"></span><span class="leds" id="leds"></span></div>
      </div>
    </div>

    <div class="hud" id="hud">
      <div class="tabs" role="tablist" id="tabs"></div>
      <span class="sep"></span>
      <div class="tabs" role="group" aria-label="Flip speed" id="speed" title="Flip speed (− and +)"></div>
      <span class="sep"></span>
      <button id="cycle" type="button" aria-pressed="true" title="Cycle boards (Space)"><span class="dot"></span><span class="label-opt">Auto-cycle</span></button>
      <button id="sound" type="button" aria-pressed="false" title="Flap sound (S)"><span class="dot"></span>Sound</button>
      <button id="fs" type="button" title="Full screen (F)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="label-opt">Full screen</span>
      </button>
    </div>
  </body>
</html>
