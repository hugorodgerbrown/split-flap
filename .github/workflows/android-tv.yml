# The Android TV app (android-tv/): unit tests, lint and a release APK on
# every change to it. A tag like tv-v0.1.0 also publishes the APK as a
# GitHub release, for sideloading onto a TV.
#
# The APK is signed with the key in the SPLITFLAP_* secrets, so each build
# installs over the last. Without them it is signed with a throwaway debug
# key: fine to try once, but the next build won't install over it.
name: Android TV

on:
  push:
    branches: [main]
    tags: ["tv-v*"]
    paths: ["android-tv/**", ".github/workflows/android-tv.yml"]
  pull_request:
    paths: ["android-tv/**", ".github/workflows/android-tv.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    env:
      SPLITFLAP_VERSION_CODE: ${{ github.run_number }}
      SPLITFLAP_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/tv-v') && github.ref_name || format('0.1.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unpack the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SPLITFLAP_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SPLITFLAP_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test, lint and build
        env:
          SPLITFLAP_KEYSTORE_PASSWORD: ${{ secrets.SPLITFLAP_KEYSTORE_PASSWORD }}
          SPLITFLAP_KEY_ALIAS: ${{ secrets.SPLITFLAP_KEY_ALIAS }}
          SPLITFLAP_KEY_PASSWORD: ${{ secrets.SPLITFLAP_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "split-flap-tv-$SPLITFLAP_VERSION_NAME.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: split-flap-tv
          path: android-tv/split-flap-tv-*.apk
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: android-tv/app/build/reports/

  release:
    if: startsWith(github.ref, 'refs/tags/tv-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: split-flap-tv
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" split-flap-tv-*.apk --repo "$GITHUB_REPOSITORY" --title "Split-Flap for Android TV $GITHUB_REF_NAME" --notes "Sideload this APK onto your Android TV or Google TV (docs/android-tv.md)."
