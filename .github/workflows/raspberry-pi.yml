# The Raspberry Pi kiosk (raspberry-pi/): shellcheck on the install script,
# and the kiosk compiled with the oldest Python a Pi runs (Raspberry Pi OS
# Bookworm ships 3.11). Its tests run with the rest in ci.yml.
name: Raspberry Pi

on:
  push:
    branches: [main]
    paths: ["raspberry-pi/**", ".github/workflows/raspberry-pi.yml"]
  pull_request:
    paths: ["raspberry-pi/**", ".github/workflows/raspberry-pi.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck the install script
        run: shellcheck raspberry-pi/install.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile the kiosk with Python 3.11
        run: python -W error -m py_compile raspberry-pi/riffle_kiosk.py
      - name: Start it and read its start page
        run: |
          RIFFLE_STATE_DIR="$RUNNER_TEMP/riffle" RIFFLE_SERVER=https://riffle.invalid \
            python raspberry-pi/riffle_kiosk.py serve &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8737/ | grep -q kiosk.js
          curl -fsS http://127.0.0.1:8737/state
